name: Publish Docker Image to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 2026-11-07: 빌드가 겹치면 늦게 끝난 예전 commit 빌드가 latest 를 덮어쓰는 것을 방지 (같은 브랜치는 순서대로 1개씩)
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check_creds
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "⚠️ DOCKERHUB_TOKEN 시크릿이 아직 등록되지 않아 Docker Hub 업로드를 건너뜁니다."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Short commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: kimmingil
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 2026-11-07: 매번 덮어쓰던 고정 버전 태그(v2.1.0) 대신 commit 별 불변 태그 + 빌드 commit 라벨
          tags: |
            kimmingil/rehab_multibots:latest
            kimmingil/rehab_multibots:sha-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
